<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smoke Effect | Nebula Login & Register</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0a0f1e, #03050b);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* smoke canvas background - wispy, animated fog */
    #smoke-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.65;
      mix-blend-mode: screen;
    }

    /* glassmorphic card container */
    .glass-panel {
      position: relative;
      z-index: 10;
      background: rgba(15, 25, 45, 0.45);
      backdrop-filter: blur(14px);
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      width: 460px;
      max-width: 92%;
      padding: 2rem 1.8rem 2.5rem;
      transition: all 0.3s ease;
    }

    /* form wrapper animation */
    .form-container {
      transition: opacity 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1), transform 0.45s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .fade-slide {
      opacity: 1;
      transform: translateY(0);
    }

    .fade-slide.hide {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      position: absolute;
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ffffff, #bfc9f0);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
      margin-bottom: 0.5rem;
    }

    .sub {
      color: #a8b2e0;
      font-weight: 400;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      border-left: 3px solid #5f7ef2;
      padding-left: 12px;
    }

    .input-group {
      margin-bottom: 1.4rem;
    }

    .input-group input {
      width: 100%;
      background: rgba(10, 20, 35, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 14px 18px;
      border-radius: 60px;
      font-size: 1rem;
      color: white;
      outline: none;
      transition: all 0.25s;
      backdrop-filter: blur(4px);
    }

    .input-group input:focus {
      border-color: #8aa3ff;
      box-shadow: 0 0 12px rgba(100, 130, 255, 0.3);
      background: rgba(20, 35, 55, 0.8);
    }

    .input-group input::placeholder {
      color: #b9c3eb;
      font-weight: 300;
    }

    button {
      width: 100%;
      background: linear-gradient(95deg, #3a5fcf, #293a7c);
      border: none;
      padding: 13px;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
      letter-spacing: 1px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    button:hover {
      transform: scale(0.98);
      background: linear-gradient(95deg, #4f72e0, #2e4085);
      box-shadow: 0 0 10px #5f7ef2aa;
    }

    .toggle-text {
      text-align: center;
      margin-top: 1.9rem;
      font-size: 0.9rem;
      color: #bcc6f0;
    }

    .toggle-link {
      color: #e2e9ff;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: 0.2s;
    }

    .toggle-link:hover {
      color: white;
      text-shadow: 0 0 3px #8aa3ff;
    }

    .message-area {
      margin-bottom: 1rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 38px;
      color: #ffd966;
      font-weight: 400;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 40px;
      padding: 6px 12px;
      backdrop-filter: blur(4px);
    }

    /* subtle smoke outlines */
    @keyframes glowPulse {
      0% { border-color: rgba(255,255,240,0.1);}
      100% { border-color: rgba(255,255,240,0.3);}
    }

    @media (max-width: 500px) {
      .glass-panel {
        padding: 1.5rem;
      }
      h2 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <canvas id="smoke-canvas"></canvas>

  <div class="glass-panel">
    <!-- Dynamic message for feedback -->
    <div class="message-area" id="statusMsg">✨ mystical smoke surrounds you</div>

    <!-- LOGIN FORM -->
    <div id="loginForm" class="form-container fade-slide">
      <h2>✦ welcome back</h2>
      <div class="sub">enter the misty realm</div>
      <div class="input-group">
        <input type="text" id="loginUsername" placeholder="username / email" autocomplete="username">
      </div>
      <div class="input-group">
        <input type="password" id="loginPassword" placeholder="password" autocomplete="current-password">
      </div>
      <button id="loginBtn">⟡ LOGIN ⟡</button>
      <div class="toggle-text">
        no account yet? <span class="toggle-link" id="showRegisterLink">create profile</span>
      </div>
    </div>

    <!-- REGISTER FORM (initially hidden but in dom) -->
    <div id="registerForm" class="form-container fade-slide hide">
      <h2>✧ join the fog</h2>
      <div class="sub">become part of the smoke</div>
      <div class="input-group">
        <input type="text" id="regUsername" placeholder="choose username" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="email" id="regEmail" placeholder="email address" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="password" id="regPassword" placeholder="create password" autocomplete="new-password">
      </div>
      <button id="registerBtn">✧ REGISTER ✧</button>
      <div class="toggle-text">
        already have an account? <span class="toggle-link" id="showLoginLink">return to login</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- SMOKE EFFECT CANVAS (procedural fluid-like wisps) ----------
      const canvas = document.getElementById('smoke-canvas');
      let ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      let animationId;
      
      // Resize handler
      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        if (ctx) {
          ctx.fillStyle = '#03050b';
          ctx.fillRect(0, 0, width, height);
        }
      }
      
      // smoke particle: soft circles with drift and life, blending
      class SmokeParticle {
        constructor(x, y, radius, speedX, speedY, alpha, growth, color) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.speedX = speedX;
          this.speedY = speedY;
          this.alpha = alpha;
          this.growth = growth;   // slowly shrink or grow
          this.color = color || `rgba(180, 200, 255, ${alpha})`;
          this.life = 1.0;        // full life
          this.decay = 0.002 + Math.random() * 0.003;
        }
        
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.radius += this.growth;
          this.life -= this.decay;
          this.alpha = Math.min(0.38, this.life * 0.45);
          // keep radius within pleasing range
          if (this.radius < 4) this.radius = 4;
          if (this.radius > 95) this.radius = 95;
          // wrap around edges with smooth drift? but smoke better fade and reset
          // but we will just return false if dead
          return this.life > 0.03;
        }
        
        draw(context) {
          context.save();
          context.globalAlpha = this.alpha * 0.7;
          context.beginPath();
          // radial gradient for soft wispy look
          const grd = context.createRadialGradient(this.x, this.y, this.radius * 0.2, this.x, this.y, this.radius);
          grd.addColorStop(0, `rgba(210, 225, 255, ${this.alpha * 0.9})`);
          grd.addColorStop(0.6, `rgba(140, 170, 240, ${this.alpha * 0.6})`);
          grd.addColorStop(1, `rgba(90, 110, 180, 0)`);
          context.fillStyle = grd;
          context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          context.fill();
          context.restore();
        }
      }
      
      let smokeParticles = [];
      let lastTimestamp = 0;
      
      function initSmokeEnvironment() {
        // create 40 initial random smoke blobs
        for (let i = 0; i < 55; i++) {
          addRandomSmokeParticle();
        }
      }
      
      function addRandomSmokeParticle() {
        const radius = 18 + Math.random() * 42;
        const x = Math.random() * width;
        const y = Math.random() * height;
        const speedX = (Math.random() - 0.5) * 0.35;
        const speedY = (Math.random() - 0.5) * 0.18 - 0.08; // slight upward drift
        const alpha = 0.15 + Math.random() * 0.25;
        const growth = (Math.random() - 0.5) * 0.08;
        const particle = new SmokeParticle(x, y, radius, speedX, speedY, alpha, growth);
        smokeParticles.push(particle);
      }
      
      function updateSmoke() {
        for (let i = 0; i < smokeParticles.length; i++) {
          const alive = smokeParticles[i].update();
          if (!alive) {
            smokeParticles.splice(i, 1);
            i--;
          }
        }
        // keep particle count between 45 and 80 for rich smoke effect
        if (smokeParticles.length < 48) {
          for (let i = 0; i < 3; i++) addRandomSmokeParticle();
        } else if (smokeParticles.length > 90) {
          smokeParticles.splice(0, smokeParticles.length - 80);
        }
      }
      
      function drawSmoke() {
        if (!ctx) return;
        ctx.clearRect(0, 0, width, height);
        // dark background gradient to enhance smokey white-blue wisps
        const gradBg = ctx.createLinearGradient(0, 0, width*0.8, height);
        gradBg.addColorStop(0, '#03050b');
        gradBg.addColorStop(1, '#101624');
        ctx.fillStyle = gradBg;
        ctx.fillRect(0, 0, width, height);
        
        // draw all smoke particles with blend mode
        ctx.globalCompositeOperation = 'lighter';
        for (let p of smokeParticles) {
          p.draw(ctx);
        }
        ctx.globalCompositeOperation = 'source-over';
        // extra soft haze overlay
        ctx.fillStyle = 'rgba(5, 8, 20, 0.2)';
        ctx.fillRect(0, 0, width, height);
      }
      
      function animateSmoke(timestamp) {
        updateSmoke();
        drawSmoke();
        animationId = requestAnimationFrame(animateSmoke);
      }
      
      function startSmoke() {
        resizeCanvas();
        initSmokeEnvironment();
        animateSmoke();
      }
      
      window.addEventListener('resize', () => {
        resizeCanvas();
        // optional: clear particles on extreme resize? but keep and reposition? just adjust canvas size, particles may go out of bounds but still fine - nice drifting
      });
      
      // ---------------- LOGIC: LOGIN / REGISTER with Demo persistence (localStorage mock) ----------------
      // simple in-memory store for demo (smoke theme)
      let users = [];
      
      // load dummy data if empty
      function loadUserData() {
        const stored = localStorage.getItem('smoke_realm_users');
        if (stored) {
          try {
            users = JSON.parse(stored);
          } catch(e) { users = []; }
        }
        if (!users || users.length === 0) {
          // default demo account
          users = [
            { username: 'smokewalker', email: 'smoke@mist.com', password: 'mist123' },
            { username: 'ember', email: 'ember@fog.com', password: 'emberpass' }
          ];
          saveUsers();
        }
      }
      
      function saveUsers() {
        localStorage.setItem('smoke_realm_users', JSON.stringify(users));
      }
      
      // helper to show status message with smoke style
      const statusDiv = document.getElementById('statusMsg');
      function setMessage(msg, isError = false) {
        statusDiv.innerHTML = isError ? `🌫️ ${msg}` : `✨ ${msg}`;
        statusDiv.style.color = isError ? '#ffbb88' : '#cae9ff';
        setTimeout(() => {
          if (statusDiv.innerHTML.includes(msg)) {
            // optional soft reset after 2.8s but only if not overwritten
            if (statusDiv.innerHTML === `✨ ${msg}` || statusDiv.innerHTML === `🌫️ ${msg}`) {
              // but don't delete if new msg appeared
            }
          }
        }, 2800);
      }
      
      // DOM elements
      const loginContainer = document.getElementById('loginForm');
      const registerContainer = document.getElementById('registerForm');
      const showRegisterLink = document.getElementById('showRegisterLink');
      const showLoginLink = document.getElementById('showLoginLink');
      const loginBtn = document.getElementById('loginBtn');
      const registerBtn = document.getElementById('registerBtn');
      
      // Input fields
      const loginUsername = document.getElementById('loginUsername');
      const loginPassword = document.getElementById('loginPassword');
      const regUsername = document.getElementById('regUsername');
      const regEmail = document.getElementById('regEmail');
      const regPassword = document.getElementById('regPassword');
      
      function switchToLogin() {
        loginContainer.classList.remove('hide');
        registerContainer.classList.add('hide');
        setMessage('enter the veil of smoke ...', false);
        // clear inputs (optional but friendly)
        loginUsername.value = '';
        loginPassword.value = '';
      }
      
      function switchToRegister() {
        registerContainer.classList.remove('hide');
        loginContainer.classList.add('hide');
        setMessage('carve your sigil into the mist', false);
        regUsername.value = '';
        regEmail.value = '';
        regPassword.value = '';
      }
      
      showRegisterLink.addEventListener('click', switchToRegister);
      showLoginLink.addEventListener('click', switchToLogin);
      
      // Registration logic
      function handleRegister() {
        const username = regUsername.value.trim();
        const email = regEmail.value.trim();
        const password = regPassword.value.trim();
        
        if (!username || !email || !password) {
          setMessage('All fields required in the smoky realm', true);
          return;
        }
        if (password.length < 4) {
          setMessage('Password must be at least 4 characters', true);
          return;
        }
        if (!email.includes('@') || !email.includes('.')) {
          setMessage('email must be valid (contains @ and .)', true);
          return;
        }
        // check if username or email exists
        const userExists = users.find(u => u.username === username);
        if (userExists) {
          setMessage(`Username "${username}" already claimed in the fog`, true);
          return;
        }
        const emailExists = users.find(u => u.email === email);
        if (emailExists) {
          setMessage('Email already registered, try another', true);
          return;
        }
        
        users.push({ username, email, password });
        saveUsers();
        setMessage(`✓ Registered successfully! now login, ${username}`, false);
        // auto switch to login after 1 sec
        setTimeout(() => {
          switchToLogin();
          // prefill username?
          loginUsername.value = username;
          loginPassword.value = '';
          setMessage('now enter your password to login', false);
        }, 1200);
      }
      
      // Login logic
      function handleLogin() {
        const usernameOrEmail = loginUsername.value.trim();
        const pwd = loginPassword.value.trim();
        if (!usernameOrEmail || !pwd) {
          setMessage('Please fill both username/email and password', true);
          return;
        }
        const foundUser = users.find(user => 
          (user.username === usernameOrEmail || user.email === usernameOrEmail) && user.password === pwd
        );
        if (foundUser) {
          setMessage(`Welcome back, ${foundUser.username} · smoke swirls around you`, false);
          // extra effect: add burst of smoke particles from mouse? but canvas fun
          createLoginSmokeBurst();
          // reset fields after success feel
          setTimeout(() => {
            setMessage('login successful — (demo experience)', false);
          }, 1500);
        } else {
          setMessage('Invalid credentials, check your misty whispers', true);
        }
      }
      
      // visual burst: add many particles around center for smoke effect on login success
      function createLoginSmokeBurst() {
        if (!width || !height) return;
        const centerX = width / 2;
        const centerY = height / 2;
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 40 + Math.random() * 120;
          const x = centerX + Math.cos(angle) * dist;
          const y = centerY + Math.sin(angle) * dist * 0.6;
          const radius = 20 + Math.random() * 45;
          const speedX = (Math.random() - 0.5) * 0.9;
          const speedY = (Math.random() - 0.5) * 0.5 - 0.2;
          const alpha = 0.4;
          const growth = (Math.random() - 0.5) * 0.1;
          const burstParticle = new SmokeParticle(x, y, radius, speedX, speedY, alpha, growth);
          smokeParticles.push(burstParticle);
        }
        // also add some wisps floating upward
        for (let i = 0; i < 12; i++) {
          addRandomSmokeParticle();
        }
      }
      
      // attach events
      loginBtn.addEventListener('click', handleLogin);
      registerBtn.addEventListener('click', handleRegister);
      
      // pressing enter on key fields
      const inputs = [loginUsername, loginPassword, regUsername, regEmail, regPassword];
      inputs.forEach(input => {
        if (input) {
          input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              if (loginContainer && !loginContainer.classList.contains('hide')) {
                handleLogin();
              } else if (registerContainer && !registerContainer.classList.contains('hide')) {
                handleRegister();
              }
            }
          });
        }
      });
      
      // init data & start canvas smoke
      loadUserData();
      startSmoke();
      
      // animate extra micro particles from mouse movement (ethereal smoke trail)
      let mouseTimeout;
      function onMouseMove(e) {
        if (!width || !height) return;
        const x = e.clientX;
        const y = e.clientY;
        // add tiny wisp occasionally
        if (Math.random() < 0.35) {
          const radius = 8 + Math.random() * 24;
          const speedX = (Math.random() - 0.5) * 0.25;
          const speedY = (Math.random() - 0.5) * 0.2 - 0.05;
          const alpha = 0.2 + Math.random() * 0.2;
          const particle = new SmokeParticle(x, y, radius, speedX, speedY, alpha, 0.02);
          smokeParticles.push(particle);
          // limit total particles to avoid overkill
          if (smokeParticles.length > 130) smokeParticles.splice(0, 25);
        }
      }
      
      window.addEventListener('mousemove', onMouseMove);
      
      // small interval to ensure smoke density stays organic
      setInterval(() => {
        if (smokeParticles.length < 55) {
          for(let i=0;i<2;i++) addRandomSmokeParticle();
        }
      }, 1800);
    })();
  </script>
</body>
</html>
